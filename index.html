<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בקשת העברת פיקדון - קרן אסתר</title>
    <!-- טעינת העיצוב Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- טעינת ספריית החתימות -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <style>
        /* מניעת גלילה של המסך בזמן חתימה בנייד */
        #signature-pad { touch-action: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 py-6 sm:py-10 px-4">

    <!-- מסך ההצלחה (מוסתר כברירת מחדל) -->
    <div id="successScreen" class="hidden min-h-[60vh] flex items-center justify-center">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border-t-8 border-blue-900">
            <svg class="w-20 h-20 text-green-500 mx-auto mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">בקשתך התקבלה בהצלחה!</h2>
            <p class="text-slate-600 mb-6">הנתונים נקלטו במערכת קרן אסתר ותועבר לטיפול ההנהלה.</p>
            <button onclick="location.reload()" class="px-6 py-2 bg-blue-900 text-white rounded-lg hover:bg-blue-800 transition-colors">
                חזרה לדף הבית
            </button>
        </div>
    </div>

    <!-- טופס הבקשה -->
    <div id="formScreen" class="max-w-3xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- כותרת עליונה -->
        <div class="bg-blue-900 px-8 py-10 text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-800 rounded-full -mr-10 -mt-10 opacity-50"></div>
            <svg class="w-12 h-12 text-yellow-500 mx-auto mb-4 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
            <h1 class="text-3xl font-bold text-white mb-2 relative z-10">בקשת העברת פיקדון</h1>
            <p class="text-blue-200 relative z-10 text-lg">קרן אסתר - טופס הקצאת כספי פיקדון עבור לווה</p>
        </div>

        <form id="gemachForm" class="p-6 sm:p-10">
            
            <!-- זיהוי המפקיד -->
            <div class="mb-10">
                <h3 class="text-lg font-semibold text-blue-900 border-b-2 border-slate-100 pb-2 mb-6">1. זיהוי המפקיד</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">שם מלא</label>
                        <input type="text" id="depositorName" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50 focus:bg-white transition-colors" placeholder="ישראל ישראלי">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">מספר תעודת זהות</label>
                        <input type="text" id="depositorId" required minlength="8" maxlength="9" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50 focus:bg-white transition-colors" placeholder="123456789">
                    </div>
                </div>
            </div>

            <!-- פרטי ההקצאה -->
            <div class="mb-10 bg-blue-50/50 p-6 rounded-xl border border-blue-100">
                <h3 class="text-lg font-semibold text-blue-900 mb-4">2. הסכום להקצאה</h3>
                <div class="space-y-4">
                    <label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-white transition-colors border border-transparent hover:border-slate-200">
                        <input type="radio" name="allocationType" value="all" checked onchange="toggleAmountField()" class="w-5 h-5 text-blue-600 border-slate-300 focus:ring-blue-500">
                        <span class="text-slate-700 font-medium">כל יתרת הפיקדון שלי</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-white transition-colors border border-transparent hover:border-slate-200">
                        <input type="radio" name="allocationType" value="specific" onchange="toggleAmountField()" class="w-5 h-5 text-blue-600 border-slate-300 focus:ring-blue-500">
                        <span class="text-slate-700 font-medium">סכום ספציפי מתוך הפיקדון</span>
                    </label>

                    <!-- שדה סכום ספציפי (מוסתר) -->
                    <div id="specificAmountContainer" class="hidden relative w-full sm:w-1/2 mr-8 mt-2">
                        <span class="absolute left-4 top-3 text-slate-400 font-medium">₪</span>
                        <input type="number" id="specificAmount" placeholder="הזן סכום" class="w-full pl-8 pr-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                </div>
            </div>

            <!-- פרטי הלווה -->
            <div class="mb-10">
                <h3 class="text-lg font-semibold text-blue-900 border-b-2 border-slate-100 pb-2 mb-6">3. פרטי המוטב (הלווה)</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">שם הלווה</label>
                        <input type="text" id="borrowerName" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">תעודת זהות של הלווה</label>
                        <input type="text" id="borrowerId" required minlength="8" maxlength="9" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50 focus:bg-white">
                    </div>
                </div>
            </div>

            <!-- הצהרות -->
            <div class="mb-10">
                <h3 class="text-lg font-semibold text-blue-900 border-b-2 border-slate-100 pb-2 mb-4">4. הצהרת המפקיד</h3>
                <div class="space-y-4 bg-slate-50 p-5 rounded-xl border border-slate-200">
                    <label class="flex items-start gap-3 cursor-pointer">
                        <input type="checkbox" id="agreeLock" required class="w-5 h-5 mt-1 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                        <span class="text-sm text-slate-700">אני מבין כי מרגע הקצאת הכסף ללווה הנ"ל, הפיקדון יהיה נעול ולא ניתן למשיכה, עד לפירעון המלא של ההלוואה על ידי הלווה.</span>
                    </label>
                </div>
            </div>

            <!-- חתימה -->
            <div class="mb-10">
                <h3 class="text-lg font-semibold text-blue-900 mb-4">5. חתימה דיגיטלית</h3>
                <div class="border-2 border-dashed border-slate-300 bg-slate-50 rounded-xl overflow-hidden relative">
                    <canvas id="signature-pad" class="w-full h-48 sm:h-64 cursor-crosshair"></canvas>
                    <div class="absolute bottom-4 left-4">
                        <button type="button" onclick="clearSignature()" class="bg-white px-3 py-1.5 rounded-md shadow text-sm text-slate-600 hover:text-slate-900 border border-slate-200">
                            נקה חתימה
                        </button>
                    </div>
                </div>
                <p id="signatureError" class="hidden text-red-500 text-sm mt-2 font-medium">נא לחתום במשבצת</p>
            </div>

            <!-- כפתור שליחה -->
            <button type="submit" class="w-full bg-blue-900 text-white font-bold text-lg py-4 rounded-xl shadow-lg hover:bg-blue-800 transition-all transform hover:-translate-y-1">
                שלח בקשה והקצה פיקדון
            </button>
        </form>
    </div>

    <!-- קוד הלוגיקה של הטופס (JavaScript) -->
    <!-- קוד הלוגיקה של הטופס (JavaScript) המעודכן עם חיבור לגוגל -->
    <script>
        // אתחול לוח החתימה
        const canvas = document.getElementById('signature-pad');
        function resizeCanvas() {
            const ratio =  Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
        }
        window.onresize = resizeCanvas;
        resizeCanvas();

        const signaturePad = new SignaturePad(canvas, {
            penColor: "rgb(30, 64, 175)", // צבע כחול כהה של העט
            backgroundColor: "rgb(248, 250, 252)" // צבע רקע תואם לעיצוב
        });

        function clearSignature() {
            signaturePad.clear();
            document.getElementById('signatureError').classList.add('hidden');
        }

        // הצגה/הסתרה של שדה הסכום הספציפי
        function toggleAmountField() {
            const radios = document.getElementsByName('allocationType');
            const specificContainer = document.getElementById('specificAmountContainer');
            const specificInput = document.getElementById('specificAmount');
            
            let isSpecific = false;
            for(let i = 0; i < radios.length; i++) {
                if(radios[i].checked && radios[i].value === 'specific') {
                    isSpecific = true;
                }
            }

            if(isSpecific) {
                specificContainer.classList.remove('hidden');
                specificInput.setAttribute('required', 'true');
            } else {
                specificContainer.classList.add('hidden');
                specificInput.removeAttribute('required');
                specificInput.value = '';
            }
        }

        // ===== כאן מתחיל הקוד החדש של השליחה לגוגל =====
        document.getElementById('gemachForm').addEventListener('submit', function(e) {
            e.preventDefault(); // מונע רענון של העמוד

            // בדיקה אם המשתמש חתם
            if (signaturePad.isEmpty()) {
                document.getElementById('signatureError').classList.remove('hidden');
                return;
            }

            // איסוף הנתונים
            const formData = {
                depositorName: document.getElementById('depositorName').value,
                depositorId: document.getElementById('depositorId').value,
                allocationType: document.querySelector('input[name="allocationType"]:checked').value,
                specificAmount: document.getElementById('specificAmount').value,
                borrowerName: document.getElementById('borrowerName').value,
                borrowerId: document.getElementById('borrowerId').value,
                signatureImage: signaturePad.toDataURL() 
            };

            // שינוי כפתור השליחה ל"שולח..." כדי שהלקוח ימתין
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'שולח נתונים, אנא המתן...';
            submitBtn.disabled = true;

            // >>>>> שים לב: כאן אתה מדביק את הכתובת הארוכה שקיבלת מגוגל סקריפט! <<<<<
            const googleScriptURL = 'https://script.google.com/macros/s/AKfycbwUjCWm-WCK9mr2yW4oeJINw7mN8VkStAOSkq7AmIbLF3HJB3BSQvxF7iDR5rw2948Wdw/exec';

            // שליחת הנתונים לשרת של גוגל
            fetch(googleScriptURL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === "success") {
                    // הצלחה! מעבר למסך תודה
                    document.getElementById('formScreen').classList.add('hidden');
                    document.getElementById('successScreen').classList.remove('hidden');
                    window.scrollTo(0,0);
                } else {
                    alert("אירעה שגיאה בשמירת הנתונים.");
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert("שגיאת תקשורת. אנא נסה שוב.");
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
